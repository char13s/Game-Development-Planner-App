
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@0.8.2/dist/index.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        #flow-canvas-container { width: 100%; height: calc(100vh - 120px); position: relative; }
        #flow-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .node {
            position: absolute;
            cursor: grab;
            background-color: #2c3e50;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            border: 2px solid #34495e;
            min-width: 150px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.2s;
            user-select: none;
        }
        .node:hover { box-shadow: 0 0 15px #4e6e8e; }
        .node.circle { border-radius: 50%; }
        .node.diamond {
            transform: rotate(45deg);
            transform-origin: center center;
            width: 120px;
            height: 120px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
        .node.diamond .node-title { transform: rotate(-45deg); }
        .hidden { display: none; }
        #context-menu { position: absolute; z-index: 1000; background-color: #2c2c44; border: 1px solid #4f4f7a; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); padding: 8px; display: none; }
        #context-menu div { padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        #context-menu div:hover { background-color: #4f4f7a; }
    </style>
</head>
<body class="bg-gray-900 text-white p-8">

    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-80 z-100 flex justify-center items-center"><p>Connecting...</p></div>

    <div id="main-content" class="hidden">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold">Story Flow</h1>
                <p id="user-info" class="text-indigo-400"></p>
            </div>
            <div class="flex space-x-4 items-center">
                <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Planner</a>
                <a href="folders.html" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg">Folders</a>
                <a href="screenplay.html" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg">Screenplay</a>
                <a href="archive.html" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">Archive</a>
                <button id="sign-out-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Sign Out</button>
            </div>
        </div>

        <div id="flow-canvas-container">
            <svg id="flow-canvas"></svg>
        </div>
    </div>

    <div id="context-menu"></div>

    <!-- Input Modal -->
    <div id="input-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center z-50">
        <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-md border border-gray-700">
            <h2 id="input-modal-title" class="text-3xl font-bold mb-6"></h2>
            <form id="input-form">
                <div class="mb-4">
                    <label id="input-modal-label" for="input-modal-field" class="block text-gray-400 mb-2"></label>
                    <input type="text" id="input-modal-field" class="w-full bg-gray-700 rounded p-3" required>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="close-input-modal-btn" class="bg-gray-600 hover:bg-gray-700 rounded py-2 px-4">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 rounded py-2 px-4">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Node Editor Modal -->
    <div id="editor-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center z-50">
        <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-lg border border-gray-700">
            <h2 class="text-3xl font-bold mb-6">Edit Node</h2>
            <form id="editor-form">
                <input type="hidden" id="editor-node-id">
                <div class="mb-4">
                    <label for="editor-node-title" class="block text-gray-400 mb-2">Title</label>
                    <input type="text" id="editor-node-title" class="w-full bg-gray-700 rounded p-3" required>
                </div>
                <div class="mb-6">
                    <label for="editor-node-description" class="block text-gray-400 mb-2">Description</label>
                    <textarea id="editor-node-description" class="w-full bg-gray-700 rounded p-3 h-48"></textarea>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="close-editor-modal-btn" class="bg-gray-600 hover:bg-gray-700 rounded py-2 px-4">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 rounded py-2 px-4">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/flow.js"></script>

</body>
</html>
