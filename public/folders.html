
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Folders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .task-item { cursor: pointer; }
        #context-menu { position: absolute; z-index: 1000; background-color: #2c2c44; border: 1px solid #4f4f7a; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); padding: 8px; display: none; }
        #context-menu div { padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        #context-menu div:hover { background-color: #4f4f7a; }
        .hidden { display: none; }
        .dragging { opacity: 0.5; }
        .over-top { border-top: 2px solid #6366f1; }
        .over-bottom { border-bottom: 2px solid #6366f1; }
        .over-middle { background-color: #4338ca !important; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">

    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-4xl font-bold">Task Folders</h1>
            <p class="text-indigo-400">Drag folders to reorder/re-parent. Drag tasks to move.</p>
        </div>
        <a href="index.html" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg">Back to Planner</a>
    </div>

    <main id="folder-container" class="space-y-1"></main>
    
    <div id="context-menu"></div>

    <div id="task-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center z-50">
        <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-md border border-gray-700">
            <h2 id="modal-title" class="text-3xl font-bold mb-6">Edit Task</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="mb-4"><label for="task-title" class="block text-gray-400 mb-2">Title</label><input type="text" id="task-title" class="w-full bg-gray-700 rounded p-3" required></div>
                <div class="mb-4"><label for="task-desc" class="block text-gray-400 mb-2">Description</label><textarea id="task-desc" class="w-full bg-gray-700 rounded p-3 h-24"></textarea></div>
                <div class="mb-4"><label for="task-date" class="block text-gray-400 mb-2">Due Date</label><input type="date" id="task-date" class="w-full bg-gray-700 rounded p-3"></div>
                <div class="mb-4"><label for="task-folder" class="block text-gray-400 mb-2">Folder</label><select id="task-folder" class="w-full bg-gray-700 rounded p-3"></select></div>
                <div class="mb-6"><label for="task-status" class="block text-gray-400 mb-2">Status</label><select id="task-status" class="w-full bg-gray-700 rounded p-3"><option value="todo">To Do</option><option value="inprogress">In Progress</option><option value="done">Done</option></select></div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="close-modal-btn" class="bg-gray-600 hover:bg-gray-700 rounded py-2 px-4">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 rounded py-2 px-4">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig } from './js/firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        async function main() {
            const folderContainer = document.getElementById('folder-container');
            const contextMenu = document.getElementById('context-menu');
            const taskModal = document.getElementById('task-modal');
            const taskForm = document.getElementById('task-form');
            const closeModalBtn = document.getElementById('close-modal-btn');

            let app, auth, db, userId, appId, folders = [], tasks = [];
            let draggedFolderId = null; // for folder DnD

            const setupListeners = () => {
                onSnapshot(collection(db, `users/${userId}/folders`), s => { folders = s.docs.map(d => ({...d.data(), id: d.id})); render(); }, e => console.error(e));
                onSnapshot(collection(db, `users/${userId}/tasks`), s => { tasks = s.docs.map(d => ({...d.data(), id: d.id})); render(); }, e => console.error(e));
            };

            const render = () => {
                const scrollState = { top: folderContainer.scrollTop, left: folderContainer.scrollLeft };
                folderContainer.innerHTML = '';
                renderChildren(folderContainer, null, 0);
                populateFolderDropdown();
                folderContainer.scrollTop = scrollState.top;
                folderContainer.scrollLeft = scrollState.left;
            };

            const renderChildren = (container, parentId, level) => {
                const children = folders.filter(f => (f.parentId || null) === parentId).sort((a, b) => a.order - b.order);
                children.forEach(folder => {
                    const folderWrapper = document.createElement('div');
                    folderWrapper.className = 'folder-wrapper';
                    folderWrapper.style.marginLeft = `${level * 2}rem`;
                    folderWrapper.dataset.folderId = folder.id;
                    folderWrapper.draggable = true;

                    const tasksHtml = tasks.filter(t => t.folderId === folder.id).map(task => {
                        const color = ({ todo: 'bg-red-500', inprogress: 'bg-yellow-500', done: 'bg-green-500' })[task.status] || 'bg-gray-500';
                        return `<div class="task-item flex items-center justify-between bg-gray-700 p-2 rounded-md mt-2" draggable="true" data-task-id="${task.id}"><span>${task.title}</span><span class="${color} w-3 h-3 rounded-full"></span></div>`;
                    }).join('') || '<p class="text-gray-500 text-xs italic">No tasks here.</p>';

                    const folderBox = document.createElement('div');
                    folderBox.className = 'folder-box bg-gray-800 p-4 rounded-lg shadow-lg relative mt-1';
                    folderBox.innerHTML = `
                        <div class="absolute top-0 left-0 bg-indigo-600 text-white px-3 py-1 rounded-tl-lg rounded-br-lg text-sm font-bold">${folder.name}</div>
                        <div class="mt-10 space-y-2">${tasksHtml}</div>
                    `;
                    
                    const subfolderContainer = document.createElement('div');
                    folderBox.appendChild(subfolderContainer);
                    folderWrapper.appendChild(folderBox);
                    container.appendChild(folderWrapper);

                    renderChildren(subfolderContainer, folder.id, 0); // Corrected level
                });
            };

            folderContainer.addEventListener('dragstart', e => {
                const taskItem = e.target.closest('.task-item');
                if (taskItem) {
                    const task = tasks.find(t => t.id === taskItem.dataset.taskId);
                    if (task) {
                        e.dataTransfer.setData('application/json', JSON.stringify(task));
                        e.dataTransfer.effectAllowed = 'move';
                    }
                    return;
                }

                const folderWrapper = e.target.closest('.folder-wrapper');
                if (folderWrapper) {
                    draggedFolderId = folderWrapper.dataset.folderId;
                    e.dataTransfer.setData('text/plain', draggedFolderId);
                    setTimeout(() => folderWrapper.classList.add('dragging'), 0);
                }
            });

            folderContainer.addEventListener('dragover', e => {
                e.preventDefault();
                const targetWrapper = e.target.closest('.folder-wrapper');
                if (!targetWrapper) return;

                document.querySelectorAll('.over-top, .over-bottom, .over-middle').forEach(el => el.classList.remove('over-top', 'over-bottom', 'over-middle'));
                
                const isTaskDrag = e.dataTransfer.types.includes('application/json');

                if (isTaskDrag) {
                    targetWrapper.querySelector('.folder-box').classList.add('over-middle');
                } else if (draggedFolderId && targetWrapper.dataset.folderId !== draggedFolderId) {
                    const rect = targetWrapper.getBoundingClientRect();
                    const y = e.clientY - rect.top;
                    const zone = y < rect.height * 0.25 ? 'top' : y > rect.height * 0.75 ? 'bottom' : 'middle';
                    targetWrapper.querySelector('.folder-box').classList.add(`over-${zone}`);
                }
            });

            folderContainer.addEventListener('dragleave', e => {
                e.target.closest('.folder-box')?.classList.remove('over-top', 'over-bottom', 'over-middle');
            });

            folderContainer.addEventListener('dragend', e => {
                draggedFolderId = null;
                document.querySelectorAll('.dragging, .over-top, .over-bottom, .over-middle').forEach(el => el.classList.remove('dragging', 'over-top', 'over-bottom', 'over-middle'));
            });

            folderContainer.addEventListener('drop', async e => {
                e.preventDefault();
                document.querySelectorAll('.over-top, .over-bottom, .over-middle').forEach(el => el.classList.remove('over-top', 'over-bottom', 'over-middle'));
                const targetWrapper = e.target.closest('.folder-wrapper');
                if (!targetWrapper) return;

                const targetFolderId = targetWrapper.dataset.folderId;
                const taskDataString = e.dataTransfer.getData('application/json');

                if (taskDataString) {
                    const task = JSON.parse(taskDataString);
                    if (task.folderId !== targetFolderId) {
                        await updateDoc(doc(db, `users/${userId}/tasks`, task.id), { folderId: targetFolderId });
                    }
                } else if (draggedFolderId && targetFolderId !== draggedFolderId) {
                    const targetFolder = folders.find(f => f.id === targetFolderId);
                    const rect = targetWrapper.getBoundingClientRect(), y = e.clientY - rect.top;
                    const zone = y < rect.height * 0.25 ? 'top' : y > rect.height * 0.75 ? 'bottom' : 'middle';
                    
                    const batch = writeBatch(db);
                    let newOrder, newParentId;

                    if (zone === 'middle') {
                        newParentId = targetFolderId;
                        const children = folders.filter(f => f.parentId === newParentId);
                        newOrder = (children.length > 0 ? Math.max(...children.map(c => c.order)) : 0) + 1000;
                    } else {
                        newParentId = targetFolder.parentId;
                        const siblings = folders.filter(f => f.parentId === newParentId).sort((a,b) => a.order-b.order);
                        const targetIndex = siblings.findIndex(f => f.id === targetFolderId);
                        if (zone === 'top') {
                            const prevOrder = siblings[targetIndex - 1]?.order || 0;
                            newOrder = (prevOrder + targetFolder.order) / 2;
                        } else {
                             const nextOrder = siblings[targetIndex + 1]?.order;
                             newOrder = nextOrder ? (targetFolder.order + nextOrder) / 2 : targetFolder.order + 1000;
                        }
                    }
                    
                    batch.update(doc(db, `users/${userId}/folders`, draggedFolderId), { parentId: newParentId, order: newOrder });
                    await batch.commit();
                }
            });

            document.addEventListener('contextmenu', e => {
                e.preventDefault();
                const folderWrapper = e.target.closest('.folder-wrapper');
                contextMenu.style.top = `${e.clientY}px`;
                contextMenu.style.left = `${e.clientX}px`;
                contextMenu.style.display = 'block';
                const folderId = folderWrapper?.dataset.folderId;

                contextMenu.innerHTML = folderId
                    ? `<div data-action="add-task" data-id="${folderId}">Add Task</div><div data-action="add-subfolder" data-id="${folderId}">Add Subfolder</div><div data-action="rename-folder" data-id="${folderId}">Rename Folder</div><div data-action="delete-folder" data-id="${folderId}">Delete Folder</div>`
                    : '<div data-action="add-folder">Create Folder</div>';
            });

            document.addEventListener('click', e => {
                contextMenu.style.display = 'none';
                const taskId = e.target.closest('.task-item')?.dataset.taskId;
                if(taskId) openModalForEdit(taskId);
            });

            contextMenu.addEventListener('click', async e => {
                const { action, id } = e.target.dataset;
                if (!action) return;
                
                if (action === 'add-folder' || action === 'add-subfolder') {
                    const name = prompt("Enter folder name:");
                    if (name) {
                        const parentId = id || null;
                        const siblings = folders.filter(f => f.parentId === parentId);
                        const order = (siblings.length > 0 ? Math.max(...siblings.map(s => s.order)) : 0) + 1000;
                        await addDoc(collection(db, `users/${userId}/folders`), { name, parentId, order, createdAt: serverTimestamp() });
                    }
                } else if (action === 'add-task') {
                    const title = prompt("Enter task title:");
                    if (title) await addDoc(collection(db, `users/${userId}/tasks`), { title, status: 'todo', folderId: id, createdAt: serverTimestamp() });
                } else if (action === 'rename-folder') {
                    const folder = folders.find(f => f.id === id);
                    const newName = prompt("Enter new folder name:", folder.name);
                    if (newName && newName !== folder.name) {
                        await updateDoc(doc(db, `users/${userId}/folders`, id), { name: newName });
                    }
                } else if (action === 'delete-folder') {
                    const canDelete = !tasks.some(t => t.folderId === id) && !folders.some(f => f.parentId === id);
                    if (canDelete && confirm("Are you sure you want to delete this empty folder?")) {
                        await deleteDoc(doc(db, `users/${userId}/folders`, id));
                    } else if (!canDelete) {
                        alert("Cannot delete a folder that is not empty.");
                    }
                }
            });

            const openModalForEdit = (taskId) => {
                const task = tasks.find(t => t.id === taskId); if (!task) return;
                const modalTitle = document.getElementById('modal-title');
                taskModal.classList.remove('hidden');
                taskForm.reset();
                taskForm['task-id'].value = task.id;
                taskForm['task-title'].value = task.title;
                taskForm['task-desc'].value = task.description || '';
                taskForm['task-status'].value = task.status;
                taskForm['task-date'].value = task.date || '';
                taskForm['task-folder'].value = task.folderId || '';
            };

            const populateFolderDropdown = () => {
                const select = document.getElementById('task-folder');
                if (!select) return;
                const currentVal = select.value;
                select.innerHTML = '<option value="">No Folder</option>';
                const renderOptions = (parentId, level) => {
                    folders.filter(f => (f.parentId || null) === parentId).sort((a,b) => a.order - b.order).forEach(folder => {
                        select.innerHTML += `<option value="${folder.id}">${ '  '.repeat(level) }&#x2514; ${folder.name}</option>`;
                        renderOptions(folder.id, level + 1);
                    });
                }
                renderOptions(null, 0);
                select.value = currentVal;
            };

            closeModalBtn.addEventListener('click', () => taskModal.classList.add('hidden'));
            taskForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const taskId = taskForm['task-id'].value;
                const data = { 
                    title: taskForm['task-title'].value, description: taskForm['task-desc'].value,
                    status: taskForm['task-status'].value, date: taskForm['task-date'].value || null,
                    folderId: taskForm['task-folder'].value || null
                };
                if (taskId) await updateDoc(doc(db, `users/${userId}/tasks`, taskId), data);
                taskModal.classList.add('hidden');
            });

            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                appId = firebaseConfig.appId;
                onAuthStateChanged(auth, user => {
                    if (user) { userId = user.uid; setupListeners(); } 
                    else { signInAnonymously(auth).catch(e => console.error(e)); }
                });
            } catch (e) { console.error(e); document.body.innerHTML = `<div class="text-red-500 p-8">Error: Could not connect to Firebase. ${e.message}</div>`; }
        }

        main();
    </script>
</body>
</html>
