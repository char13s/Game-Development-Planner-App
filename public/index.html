
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Development Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@0.8.2/dist/index.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a2e; color: #e0e0e0; }
        .task-card { cursor: grab; position: relative; }
        .hidden { display: none; }
        .calendar-day { cursor: pointer; }
        .calendar-day.over, .kanban-column-container.over { background-color: #4338ca; }
        .kanban-column { max-height: 500px; overflow-y: auto; padding-right: 8px; }
        .kanban-column-container { padding: 1rem; border-radius: 0.75rem; background-color: #1f2937; }
        #context-menu { position: absolute; z-index: 1000; background-color: #2c2c44; border: 1px solid #4f4f7a; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); padding: 8px; display: none; }
        #context-menu div { padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        #context-menu div:hover { background-color: #4f4f7a; }
        .kanban-column::-webkit-scrollbar { width: 8px; }
        .kanban-column::-webkit-scrollbar-track { background: #2a2a4a; border-radius: 10px; }
        .kanban-column::-webkit-scrollbar-thumb { background: #4f4f7a; border-radius: 10px; }
        .kanban-column::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    </style>
</head>
<body class="bg-gray-900 text-white p-8">

    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-80 z-100 flex justify-center items-center"><p>Connecting...</p></div>

    <div id="main-content" class="hidden w-full">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold">Game Development Planner</h1>
                <p id="user-info" class="text-indigo-400"></p>
            </div>
            <div class="flex space-x-4 items-center">
                <a href="flow.html" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg">Flow</a>
                <a href="folders.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Folders</a>
                <a href="screenplay.html" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg">Screenplay</a>
                <a href="archive.html" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">Archive</a>
                <button id="sign-out-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Sign Out</button>
            </div>
        </div>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <section class="lg:col-span-2">
                <div class="flex space-x-4 mb-8">
                    <input type="text" id="search-input" placeholder="Search tasks by title..." class="w-full bg-gray-700 rounded p-3 border border-gray-600 focus:border-indigo-500 outline-none">
                    <select id="folder-filter" class="w-1/3 bg-gray-700 rounded p-3 border border-gray-600 focus:border-indigo-500 outline-none"></select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div data-status="todo" class="kanban-column-container"><h2 class="text-2xl font-semibold mb-4 text-center border-b-2 border-red-500 pb-2">To Do</h2><div id="todo-tasks" class="kanban-column space-y-4"></div></div>
                    <div data-status="inprogress" class="kanban-column-container"><h2 class="text-2xl font-semibold mb-4 text-center border-b-2 border-yellow-500 pb-2">In Progress</h2><div id="inprogress-tasks" class="kanban-column space-y-4"></div></div>
                    <div data-status="done" class="kanban-column-container"><h2 class="text-2xl font-semibold mb-4 text-center border-b-2 border-green-500 pb-2 flex justify-center items-center">Done <span id="done-counter" class="ml-2 bg-green-500 text-white text-sm font-bold px-2 py-1 rounded-full">0</span></h2><div id="done-tasks" class="kanban-column space-y-4"></div></div>
                </div>
            </section>
            <section class="lg:col-span-1"><h2 class="text-2xl font-bold mb-4 text-center">Calendar</h2><div id="calendar-container" class="bg-gray-800 p-4 rounded-lg"></div></section>
        </main>
    </div>

    <div id="context-menu"></div>

    <div id="task-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center z-50">
        <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-md border border-gray-700">
            <h2 id="modal-title" class="text-3xl font-bold mb-6">New Task</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="mb-4"><label for="task-title" class="block text-gray-400 mb-2">Title</label><input type="text" id="task-title" class="w-full bg-gray-700 rounded p-3" required></div>
                <div class="mb-4"><label for="task-desc" class="block text-gray-400 mb-2">Description</label><textarea id="task-desc" class="w-full bg-gray-700 rounded p-3 h-24"></textarea></div>
                <div class="mb-4"><label for="task-date" class="block text-gray-400 mb-2">Due Date</label><input type="date" id="task-date" class="w-full bg-gray-700 rounded p-3"></div>
                <div class="mb-4"><label for="task-folder" class="block text-gray-400 mb-2">Folder</label><select id="task-folder" class="w-full bg-gray-700 rounded p-3"></select></div>
                <div class="mb-6"><label for="task-status" class="block text-gray-400 mb-2">Status</label><select id="task-status" class="w-full bg-gray-700 rounded p-3"><option value="todo">To Do</option><option value="inprogress">In Progress</option><option value="done">Done</option></select></div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="close-modal-btn" class="bg-gray-600 hover:bg-gray-700 rounded py-2 px-4">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 rounded py-2 px-4">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/index.js?v=2"></script>

</body>
</html>
