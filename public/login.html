<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Game Development Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a2e; color: #e0e0e0; }
    </style>
</head>
<body class="flex justify-center items-center h-screen">

    <div class="w-full max-w-md">
        <div id="auth-container" class="bg-gray-800 p-8 rounded-2xl border border-gray-700">
            <h1 class="text-4xl font-bold text-center mb-8">Game Planner</h1>
            
            <!-- Sign In Form -->
            <form id="login-form" class="space-y-6">
                <h2 class="text-2xl font-semibold text-center">Sign In</h2>
                <div>
                    <label for="login-email" class="block text-gray-400 mb-2">Email</label>
                    <input type="email" id="login-email" class="w-full bg-gray-700 rounded p-3" required>
                </div>
                <div>
                    <label for="login-password" class="block text-gray-400 mb-2">Password</label>
                    <input type="password" id="login-password" class="w-full bg-gray-700 rounded p-3" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 rounded py-3 font-bold">Sign In</button>
            </form>

            <div class="my-6 text-center text-gray-400"> or </div>

            <!-- Sign Up Form -->
            <form id="signup-form" class="space-y-6">
                <h2 class="text-2xl font-semibold text-center">Create an Account</h2>
                <div>
                    <label for="signup-email" class="block text-gray-400 mb-2">Email</label>
                    <input type="email" id="signup-email" class="w-full bg-gray-700 rounded p-3" required>
                </div>
                <div>
                    <label for="signup-password" class="block text-gray-400 mb-2">Password</label>
                    <input type="password" id="signup-password" class="w-full bg-gray-700 rounded p-3" required>
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 rounded py-3 font-bold">Sign Up</button>
            </form>

            <p id="error-message" class="text-red-500 text-center mt-4"></p>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>

</body>
</html>
