<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Game Development Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a2e; color: #e0e0e0; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 space-y-8 bg-gray-800 rounded-2xl shadow-lg border border-gray-700">
        <div>
            <h1 class="text-4xl font-bold text-center text-white">Game Planner</h1>
            <p class="mt-2 text-center text-indigo-400">Sign in to your account</p>
        </div>
        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-400">Email address</label>
                <div class="mt-1">
                    <input id="email" name="email" type="email" autocomplete="email" required
                           class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-400">Password</label>
                <div class="mt-1">
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                           class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>
            <div id="error-message" class="text-red-400 text-sm hidden"></div>
            <div class="flex flex-col space-y-4">
                <button type="button" id="signin-btn" class="w-full py-3 px-4 font-semibold rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Sign In
                </button>
                <button type="button" id="signup-btn" class="w-full py-3 px-4 font-semibold rounded-lg text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                    Sign Up
                </button>
                <button type="button" id="guest-btn" class="w-full py-2 px-4 font-medium rounded-lg text-indigo-300 bg-gray-700 hover:bg-gray-600 focus:outline-none">
                    Continue as Guest
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { firebaseConfig } from './js/firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const signinBtn = document.getElementById('signin-btn');
        const signupBtn = document.getElementById('signup-btn');
        const guestBtn = document.getElementById('guest-btn');
        const errorMessage = document.getElementById('error-message');

        const showError = (message) => {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        const handleSuccess = () => {
            window.location.href = 'index.html';
        }

        signinBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if (!email || !password) {
                showError("Please enter both email and password.");
                return;
            }
            signInWithEmailAndPassword(auth, email, password)
                .then(handleSuccess)
                .catch((error) => {
                    showError(error.message);
                });
        });

        signupBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if (!email || !password) {
                showError("Please enter both email and password to sign up.");
                return;
            }
            createUserWithEmailAndPassword(auth, email, password)
                .then(handleSuccess)
                .catch((error) => {
                    showError(error.message);
                });
        });

        guestBtn.addEventListener('click', () => {
            signInAnonymously(auth)
                .then(handleSuccess)
                .catch((error) => {
                showError(error.message);
            });
        });

    </script>
</body>
</html>
